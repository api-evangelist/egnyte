aid: egnyte
name: Egnyte
description: Egnyte is an enterprise content collaboration and file sharing platform
  that provides secure cloud and hybrid file storage, document collaboration, governance,
  and data security controls for regulated industries. Egnyte's Public API exposes
  the file system, users, groups, permissions, audit reporting, links, and workflow
  capabilities so partners and customers can build custom integrations. Authentication
  is handled via OAuth 2.0 (Authorization Code, Implicit, Resource Owner, and Refresh
  Token flows) scoped per API surface.
